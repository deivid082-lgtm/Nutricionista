<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Practica las Potencias</title>
<style>
  :root {
    --bg: #f4f1ea;
    --card-bg: #ffffff;
    --text: #2b2620;
    --text-soft: #6b6357;
    --accent: #d9713c;
    --accent-dark: #b5551f;
    --accent-soft: #f3d9c8;
    --success: #4c8c5a;
    --success-bg: #e2f0e4;
    --error: #c4453c;
    --error-bg: #fbe3e1;
    --border: #e6dfd2;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1d1a16;
      --card-bg: #2a251f;
      --text: #f2ede4;
      --text-soft: #b3aa9c;
      --accent: #e8895a;
      --accent-dark: #f0a679;
      --accent-soft: #4a3323;
      --success: #7fbf8e;
      --success-bg: #24352a;
      --error: #e07a72;
      --error-bg: #3a2422;
      --border: #3c3428;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1d1a16;
    --card-bg: #2a251f;
    --text: #f2ede4;
    --text-soft: #b3aa9c;
    --accent: #e8895a;
    --accent-dark: #f0a679;
    --accent-soft: #4a3323;
    --success: #7fbf8e;
    --success-bg: #24352a;
    --error: #e07a72;
    --error-bg: #3a2422;
    --border: #3c3428;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 20px 16px;
  }
  .wrap {
    width: 100%;
    max-width: 480px;
  }
  h1 {
    font-size: 1.4rem;
    text-align: center;
    margin: 4px 0 4px;
    color: var(--accent-dark);
  }
  .subtitle {
    text-align: center;
    color: var(--text-soft);
    font-size: 0.9rem;
    margin-bottom: 18px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px 20px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.06);
  }
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    font-size: 0.85rem;
    color: var(--text-soft);
  }
  .level-select {
    display: flex;
    gap: 6px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .level-btn {
    flex: 1;
    min-width: 90px;
    padding: 8px 6px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 0.8rem;
    cursor: pointer;
    text-align: center;
  }
  .level-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
    font-weight: 600;
  }
  .score {
    font-weight: 600;
    color: var(--accent-dark);
  }
  .question-box {
    text-align: center;
    padding: 26px 10px;
    margin-bottom: 18px;
  }
  .expression {
    font-size: 2.6rem;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .expression sup {
    color: var(--accent);
    font-size: 1.6rem;
    margin-left: 2px;
  }
  .hint {
    color: var(--text-soft);
    font-size: 0.85rem;
    margin-top: 10px;
  }
  input[type="number"] {
    width: 100%;
    font-size: 1.4rem;
    text-align: center;
    padding: 12px;
    border-radius: 12px;
    border: 2px solid var(--border);
    background: var(--bg);
    color: var(--text);
    margin-bottom: 12px;
    -moz-appearance: textfield;
  }
  input[type="number"]:focus {
    outline: none;
    border-color: var(--accent);
  }
  .btn-row {
    display: flex;
    gap: 10px;
  }
  button.action {
    flex: 1;
    padding: 13px 10px;
    border-radius: 12px;
    border: none;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-check {
    background: var(--accent);
    color: white;
  }
  .btn-next {
    background: var(--border);
    color: var(--text);
  }
  .feedback {
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 0.95rem;
    line-height: 1.4;
    display: none;
  }
  .feedback.correct {
    display: block;
    background: var(--success-bg);
    color: var(--success);
  }
  .feedback.wrong {
    display: block;
    background: var(--error-bg);
    color: var(--error);
  }
  .feedback b { color: inherit; }
  .streak {
    text-align: center;
    margin-top: 10px;
    font-size: 0.8rem;
    color: var(--text-soft);
  }
  .footer-note {
    text-align: center;
    font-size: 0.78rem;
    color: var(--text-soft);
    margin-top: 16px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔢 Practica las Potencias</h1>
  <div class="subtitle">1º ESO — Elige un nivel y resuelve</div>

  <div class="level-select" id="levelSelect">
    <button class="level-btn active" data-level="facil">Fácil</button>
    <button class="level-btn" data-level="medio">Medio</button>
    <button class="level-btn" data-level="dificil">Difícil</button>
    <button class="level-btn" data-level="mix">Mezcla</button>
  </div>

  <div class="card">
    <div class="top-row">
      <span>Pregunta <span id="qNum">1</span></span>
      <span class="score">✅ <span id="score">0</span> / <span id="total">0</span></span>
    </div>

    <div class="question-box">
      <div class="expression" id="expression">2<sup>3</sup></div>
      <div class="hint" id="hint">¿Cuánto vale esta potencia?</div>
    </div>

    <input type="number" id="answerInput" placeholder="Escribe el resultado" inputmode="numeric">

    <div class="btn-row">
      <button class="action btn-check" id="checkBtn">Comprobar</button>
      <button class="action btn-next" id="nextBtn">Siguiente ➜</button>
    </div>

    <div class="feedback" id="feedback"></div>
    <div class="streak" id="streak"></div>
  </div>

  <div class="footer-note">Consejo: recuerda que <b>base^exponente</b> es multiplicar la base por sí misma tantas veces como diga el exponente.</div>
</div>

<script>
  let currentLevel = 'facil';
  let score = 0;
  let total = 0;
  let questionCount = 0;
  let currentAnswer = null;
  let currentBase = null;
  let currentExp = null;
  let streak = 0;
  let bestStreak = 0;

  const expressionEl = document.getElementById('expression');
  const hintEl = document.getElementById('hint');
  const inputEl = document.getElementById('answerInput');
  const feedbackEl = document.getElementById('feedback');
  const scoreEl = document.getElementById('score');
  const totalEl = document.getElementById('total');
  const qNumEl = document.getElementById('qNum');
  const streakEl = document.getElementById('streak');
  const checkBtn = document.getElementById('checkBtn');
  const nextBtn = document.getElementById('nextBtn');
  const levelBtns = document.querySelectorAll('.level-btn');

  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function generateQuestion() {
    let base, exp;
    if (currentLevel === 'facil') {
      base = randInt(2, 6);
      exp = randInt(0, 2);
    } else if (currentLevel === 'medio') {
      base = randInt(2, 8);
      exp = randInt(2, 3);
    } else if (currentLevel === 'dificil') {
      base = randInt(2, 10);
      exp = randInt(3, 4);
    } else {
      // mix
      base = randInt(2, 10);
      exp = randInt(0, 4);
    }
    currentBase = base;
    currentExp = exp;
    currentAnswer = Math.pow(base, exp);

    expressionEl.innerHTML = base + '<sup>' + exp + '</sup>';

    if (exp === 0) {
      hintEl.textContent = 'Recuerda: cualquier número elevado a 0 es 1.';
    } else if (exp === 1) {
      hintEl.textContent = 'Recuerda: elevado a 1, el número queda igual.';
    } else {
      hintEl.textContent = 'Multiplica ' + base + ' por sí mismo ' + exp + ' veces.';
    }

    questionCount++;
    qNumEl.textContent = questionCount;
    inputEl.value = '';
    feedbackEl.className = 'feedback';
    feedbackEl.textContent = '';
    inputEl.focus();
  }

  function buildExpansion(base, exp) {
    if (exp === 0) return '1 (por definición)';
    if (exp === 1) return String(base);
    return Array(exp).fill(base).join(' × ');
  }

  function checkAnswer() {
    const userVal = inputEl.value.trim();
    if (userVal === '') return;
    const userNum = Number(userVal);
    total++;
    totalEl.textContent = total;

    if (userNum === currentAnswer) {
      score++;
      streak++;
      bestStreak = Math.max(bestStreak, streak);
      scoreEl.textContent = score;
      feedbackEl.className = 'feedback correct';
      feedbackEl.innerHTML = '🎉 <b>¡Correcto!</b> ' + currentBase + '<sup>' + currentExp + '</sup> = ' + buildExpansion(currentBase, currentExp) + (currentExp > 1 ? ' = ' + currentAnswer : '');
    } else {
      streak = 0;
      feedbackEl.className = 'feedback wrong';
      feedbackEl.innerHTML = '❌ <b>No es correcto.</b> ' + currentBase + '<sup>' + currentExp + '</sup> = ' + buildExpansion(currentBase, currentExp) + (currentExp > 1 ? ' = ' + currentAnswer : '') + '. ¡Sigue practicando!';
    }
    updateStreakLine();
  }

  function updateStreakLine() {
    if (streak >= 2) {
      streakEl.textContent = '🔥 Racha actual: ' + streak + ' aciertos seguidos (mejor: ' + bestStreak + ')';
    } else if (total > 0) {
      streakEl.textContent = 'Mejor racha: ' + bestStreak;
    } else {
      streakEl.textContent = '';
    }
  }

  checkBtn.addEventListener('click', checkAnswer);
  nextBtn.addEventListener('click', generateQuestion);
  inputEl.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      if (feedbackEl.textContent === '') {
        checkAnswer();
      } else {
        generateQuestion();
      }
    }
  });

  levelBtns.forEach(function(btn) {
    btn.addEventListener('click', function() {
      levelBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentLevel = btn.dataset.level;
      score = 0;
      total = 0;
      questionCount = 0;
      streak = 0;
      bestStreak = 0;
      scoreEl.textContent = 0;
      totalEl.textContent = 0;
      generateQuestion();
    });
  });

  generateQuestion();
</script>
</body>
</html>
